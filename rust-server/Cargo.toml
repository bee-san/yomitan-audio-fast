[package]
name = "yomitan-audio-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance loopback-only Yomitan local audio server"
license = "MIT"

[[bin]]
name = "yomitan-audio-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http1", "json", "query", "tokio"] }
blake3 = "1.8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
hashbrown = "0.16"
http = "1.3"
memmap2 = "0.9"
moka = { version = "0.12", features = ["sync"] }
rayon = "1.11"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal"] }
url = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
