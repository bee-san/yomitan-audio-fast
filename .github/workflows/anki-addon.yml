name: Anki add-on

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile add-on
        run: python -m compileall -q anki-addon
      - name: Run tests
        run: python -m unittest discover -s anki-addon/tests -v
      - name: Build code-only package
        shell: pwsh
        run: ./anki-addon/build-code-only-package.ps1 -OutputPath ./local-audio-fast.ankiaddon
      - name: Verify package payload
        run: |
          python - <<'PY'
          import json
          import zipfile

          archive = "local-audio-fast.ankiaddon"
          with zipfile.ZipFile(archive) as package:
              names = set(package.namelist())
              expected = {
                  "__init__.py",
                  "cleanup.py",
                  "config.py",
                  "consts.py",
                  "db_utils.py",
                  "default_config.json",
                  "fast_pack.py",
                  "fast_store.py",
                  "gui.py",
                  "import_dialog.py",
                  "jp_util.py",
                  "manifest.json",
                  "migration.py",
                  "progress_ui.py",
                  "server.py",
                  "util.py",
                  "version.txt",
                  "source/__init__.py",
                  "source/ajt_jp.py",
                  "source/audio_source.py",
                  "source/flat.py",
                  "source/forvo.py",
                  "source/jpod.py",
                  "source/nhk16.py",
                  "source/ozk5.py",
              }
              assert names == expected, (sorted(expected - names), sorted(names - expected))
              assert "manifest.json" in names
              assert "__init__.py" in names
              assert json.loads(package.read("manifest.json"))["package"] == "1045800357"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: local-audio-fast
          path: local-audio-fast.ankiaddon
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: local-audio-fast
      - name: Publish installable add-on
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" local-audio-fast.ankiaddon --clobber
